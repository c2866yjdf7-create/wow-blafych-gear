name: Update Blafych gear

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    paths:
      - "scripts/update_gear.py"
      - ".github/workflows/update-gear.yml"

permissions:
  contents: write

concurrency:
  group: update-blafych-gear
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Raider.IO gear
        run: python scripts/update_gear.py

      - name: Save updated equipment snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gear.json
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Refresh Blafych equipment from Raider.IO"
            git push
          fi
