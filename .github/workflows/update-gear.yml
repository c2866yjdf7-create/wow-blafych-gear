name: Update Blafych data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    paths:
      - "scripts/update_gear.py"
      - "scripts/build_reports.py"
      - "talent-import.txt"
      - ".github/workflows/update-gear.yml"

permissions:
  contents: write

concurrency:
  group: update-blafych-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh character data
        run: python scripts/update_gear.py

      - name: Build character reports
        run: python scripts/build_reports.py

      - name: Commit data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gear.json mythic-plus.json raids.json talents.json weekly.json gear-history.json enchant-audit.json next-keys.md DASHBOARD.md
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Refresh Blafych character dashboard"
            git push
          fi
